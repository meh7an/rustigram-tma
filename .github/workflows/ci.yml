name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter './packages/**' build

      - name: Typecheck
        run: pnpm -r --filter './packages/**' typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  type-sync:
    name: Rust Type Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rustigram-tma
        uses: actions/checkout@v6
        with:
          path: rustigram-tma

      - name: Checkout rustigram
        uses: actions/checkout@v6
        with:
          repository: meh7an/rustigram
          path: rustigram

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustigram

      - name: Generate types
        run: |
          cargo run \
            --manifest-path rustigram/Cargo.toml \
            -p rustigram-miniapp \
            --example gen-types \
            --features ts
        env:
          TMA_TYPES_OUT: /tmp/tma-generated

      - name: Check for drift
        run: |
          diff -r \
            --exclude="index.ts" \
            /tmp/tma-generated \
            rustigram-tma/packages/core/src/generated/
          echo "Generated types are in sync with Rust structs."
